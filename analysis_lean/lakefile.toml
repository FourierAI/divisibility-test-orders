name = "screeningAnalysis"
version = "0.1.0"
defaultTargets = ["ScreeningAnalysis", "AnalysisAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[lean_lib]]
name = "ScreeningAnalysis"
moreLeanArgs = ["--trust=0", "-DwarningAsError=true"]

[[lean_lib]]
name = "AnalysisAudit"
moreLeanArgs = ["--trust=0", "-DwarningAsError=true"]
